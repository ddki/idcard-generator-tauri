<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>%VITE_APP_TITLE%</title>
		<script src="/guard.js"></script>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				padding: 0;
			}

			body {
				display: flex;
				justify-content: center;
				align-items: center;
				overflow: hidden;
				background: #fff;
				user-select: none;
				cursor: default;
			}

			img {
				display: block;
				/* 用 vmin 固定占位：图片加载前后布局稳定，也不会随窗口被无限放大到更模糊 */
				width: 70vmin;
				height: 70vmin;
				object-fit: contain;
				-webkit-user-drag: none;
				animation: splash-fade-in 240ms ease-out both;
			}

			@keyframes splash-fade-in {
				from {
					opacity: 0;
				}

				to {
					opacity: 1;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				img {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<img src="/splash.png" alt="启动中..." />
	</body>
</html>
