[package]
name = "idcard-generator"
version = "2.0.0"
description = "中国居民身份证生成器"
authors = [ "ddki" ]
license = ""
repository = "https://github.com/ddki/idcard-generator-tauri"
default-run = "idcard-generator"
edition = "2021"
rust-version = "1.90"

[build-dependencies.tauri-build]
version = "2.7.4"
features = [ ]

[dependencies]
serde_json = "1.0.154"
tauri-plugin-shell = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.14.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.7.0"

  [dependencies.serde]
  version = "1.0.229"
  features = [ "derive" ]

  [dependencies.tauri]
  version = "2.12.5"
  features = [ "devtools", "tray-icon" ]

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
