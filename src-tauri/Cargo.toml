[package]
name = "idcard-generator"
version = "0.1.14"
description = "中国居民身份证生成器"
authors = [ "ddki" ]
license = ""
repository = "https://github.com/ddki/idcard-generator-tauri"
default-run = "idcard-generator"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [ ] }

[dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tauri = { version = "1.8", features = [
  "shell-open",
  "dialog-open",
  "process-relaunch",
  "updater",
  "system-tray",
  "devtools",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
# Tauri v1：生产构建（custom protocol）由 CLI 通过此 feature 打开
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
