name: Release CI

on:
  push:
    tags:
      # Tauri v1 分支使用 tauri1_v 前缀，避免与 master(v2) 的 v* tag 冲突
      - 'tauri1_v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # pnpm 并使用缓存安装包
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          version: 12
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate UPDATE_LOG.md
        run: pnpm run script:changelog

      - name: get app version
        # 版本号（tag 形如 tauri1_v0.1.14）
        run: echo "app_version=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: get app name
        # 应用名称
        run: echo "app_name=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: create release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          owner: ${{ github.actor }}
          # 发布的可选标签。 如果省略，将使用 git ref （如果它是标签）。
          tag: 'tauri1_v${{ env.app_version }}'
          name: '${{ env.app_name }} tauri1_v${{ env.app_version }}'
          # 可选择将此版本标记为草稿版本。 设置为 true 以启用。
          draft: true
          # 发布的可选正文文件。 这应该是文件的路径。
          bodyFile: './updater/UPDATE_LOG.md'

      - name: echo create-release outputs
        run: echo '${{ toJSON(steps.create-release.outputs) }}'
      - name: echo create-release outputs.id
        run: echo ${{ steps.create-release.outputs.id }}

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（macos-latest 即 arm64）
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # macOS Intel：在 Apple Silicon runner 上交叉编译
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # Linux amd64：在 debian:buster 容器内构建。
          # buster = glibc 2.28，与 UOS V20 / deepin 20.x / 麒麟 V10 同一底座，
          # 产物向下兼容 glibc 2.28，向上兼容更新的发行版；
          # Tauri v1 另外依赖 webkit2gtk-4.0 + libsoup2.4（Debian 10 起即有）
          - platform: ubuntu-22.04
            args: ''
            container: debian:buster
          # Linux arm64：覆盖国产 Linux（含 UOS V20）的 ARM 机型（公开仓库才有 arm runner）
          # debian:buster 是 multi-arch 镜像，arm runner 上会自动拉 arm64 层
          - platform: ubuntu-22.04-arm
            args: ''
            container: debian:buster
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    # 只有 Linux 条目声明了 container。直接写 ${{ matrix.container }} 时，
    # 未声明的条目会被解析成空串并触发 "invalid container" 校验失败，
    # 所以用 `… || null` 兜底成「不使用容器」
    container: ${{ matrix.container != '' && matrix.container || null }}
    steps:
      - name: echo release_id
        run: echo "release_id = ${{ needs.create-release.outputs.release_id }}" ${{ needs.create-release.outputs.release_id }}

      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # tauri 1.8 的依赖栈（gtk-rs 0.15 / wry 0.24）较旧，
          # 固定一个经过验证的稳定版，避免过新的 rustc 与旧绑定不兼容
          toolchain: 1.90
          # macOS 上需要同时具备两个 target 才能交叉编译出 arm64 / x86_64 双架构
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # debian:buster 已进入 EOL，源迁到 archive.debian.org 且 Release 已过期，
      # 不切源 + 不关有效期校验的话 apt-get update 会直接失败
      - name: switch apt to debian archive (buster only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          echo 'deb [trusted=yes] http://archive.debian.org/debian buster main' > /etc/apt/sources.list
          echo 'deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main' >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10-no-check-valid-until
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/10-retries

      # 依赖清单与 matrix 中的平台名必须一致，否则 Linux 上不会安装系统依赖。
      # 容器内已是 root，不能用 sudo。
      # buster 没有 libayatana-appindicator3-dev，用等价的 libappindicator3-dev。
      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2 \
            rpm \
            ca-certificates

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # pnpm 并使用缓存安装包
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          version: 12
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install

      # 把 glibc / node 基线打到日志里：glibc 决定了产物能跑的最低发行版，
      # node 也需要在 glibc 2.28 上能真正启动（Node 官方 x64 要求 glibc ≥ 2.28）
      - name: print build baseline (linux only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          cat /etc/os-release | head -2
          ldd --version | head -1
          node -v
          pnpm -v

      - uses: tauri-apps/tauri-action@v0
        id: tauri-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 注意：Tauri v1 的 bundler/updater 读取的是 TAURI_PRIVATE_KEY 与 TAURI_KEY_PASSWORD，
          # TAURI_SIGNING_PRIVATE_KEY 是 v2 的变量名，v1 下不设置会报
          # "A public key has been found, but no private key"
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # 生成并上传 latest.json 到该 Release，供客户端 updater 检查更新
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          # Windows 同时产出 NSIS 与 MSI 时，latest.json 指向 NSIS（与应用内 installMode: passive 匹配）
          updaterJsonPreferNsis: true

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: echo release_id
        run: echo "release_id = ${{ needs.create-release.outputs.release_id }}" ${{ needs.create-release.outputs.release_id }}
      - name: publish release
        id: publish-release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
