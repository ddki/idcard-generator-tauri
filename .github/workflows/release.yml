name: Release CI

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # pnpm 并使用缓存安装包
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          version: 12
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate UPDATE_LOG.md
        run: pnpm run script:changelog

      - name: get app version
        # 版本号
        run: echo "app_version=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: get app name
        # 应用名称
        run: echo "app_name=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: create release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          owner: ${{ github.actor }}
          # 发布的可选标签。 如果省略，将使用 git ref （如果它是标签）。
          tag: 'v${{ env.app_version }}'
          name: '${{ env.app_name }} v${{ env.app_version }}'
          # 可选择将此版本标记为草稿版本。 设置为 true 以启用。
          draft: true
          # 发布的可选正文文件。 这应该是文件的路径。
          bodyFile: './updater/UPDATE_LOG.md'

      - name: echo create-release outputs
        run: echo '${{ toJSON(steps.create-release.outputs) }}'
      - name: echo create-release outputs.id
        run: echo ${{ steps.create-release.outputs.id }}

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（macos-latest 即 arm64）
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # macOS Intel：在 Apple Silicon runner 上交叉编译
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # Linux amd64：产物依赖 webkit2gtk-4.1 + libsoup3、glibc ≥ 2.35，
          # 可装于 Ubuntu 22.04+ / Debian 12+ / deepin 23+ / 统信 UOS V25(2500) / 麒麟 V11
          # 注意：统信 UOS V20 全系（1050/1060/1070，Debian 10 底座、glibc 2.28、无 webkit2gtk-4.1）
          # 无法运行 Tauri v2 应用，不在支持范围内
          - platform: ubuntu-22.04
            args: ''
          # Linux arm64：覆盖 UOS V25 / 麒麟 V11 的 ARM 机型（公开仓库才有 arm runner）
          - platform: ubuntu-22.04-arm
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: echo release_id
        run: echo "release_id = ${{ needs.create-release.outputs.release_id }}" ${{ needs.create-release.outputs.release_id }}

      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 上需要同时具备两个 target 才能交叉编译出 arm64 / x86_64 双架构
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 依赖清单与 matrix 中的平台名必须一致，否则 Linux 上不会安装系统依赖
      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2 \
            rpm

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # pnpm 并使用缓存安装包
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          version: 12
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v1
        id: tauri-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: echo release_id
        run: echo "release_id = ${{ needs.create-release.outputs.release_id }}" ${{ needs.create-release.outputs.release_id }}
      - name: publish release
        id: publish-release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
